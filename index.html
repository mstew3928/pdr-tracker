<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDR Tracker v3</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      touch-action: manipulation;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title { font-size: 1rem; font-weight: 700; color: #38bdf8; }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #ef4444;
      color: #fff;
      font-weight: 700;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
      text-align: center;
    }
    .box {
      background: #1e293b;
      padding: 6px 4px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .val { font-size: 0.95rem; font-weight: 700; }
    .lbl { font-size: 0.65rem; color: #94a3b8; }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #startBtn { background: #38bdf8; color: #0f172a; }
    #resetBtn { background: #334155; color: #f8fafc; }
    #modeBtn { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .slider-row input { width: 55%; }
    canvas {
      width: 100%;
      height: 52vh;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="title">Offline PDR v3</div>
    <div id="statusBadge" class="badge">JS Error / Cut Off</div>
  </div>

  <div class="metrics">
    <div class="box"><div class="val" id="stepsVal">0</div><div class="lbl">STEPS</div></div>
    <div class="box"><div class="val" id="distVal">0.0m</div><div class="lbl">DIST</div></div>
    <div class="box"><div class="val" id="hdgVal">0°</div><div class="lbl">HEADING</div></div>
    <div class="box"><div class="val" id="posVal">0, 0</div><div class="lbl">X, Y (m)</div></div>
  </div>

  <div class="btn-row">
    <button id="startBtn" type="button">Start</button>
    <button id="resetBtn" type="button">Reset</button>
    <button id="modeBtn" type="button">Gyro Mode</button>
  </div>

  <div class="slider-row">
    <span>Stride K: <strong id="kVal">0.45</strong></span>
    <input type="range" id="strideSlider" min="0.25" max="0.75" step="0.05" value="0.45" />
  </div>

  <canvas id="mapCanvas"></canvas>

  <script>
    // 1. Confirm JS is loaded and active immediately
    const badge = document.getElementById('statusBadge');
    badge.textContent = 'v3 Ready';
    badge.style.background = '#10b981';

    let tracking = false;
    let useCompass = false; // false = pure Gyro turn-rate (no 180 flip), true = Compass
    let steps = 0;
    let dist = 0;
    let headingDeg = 0;
    let posX = 0;
    let posY = 0;
    let path = [{ x: 0, y: 0 }];

    let filteredMag = 9.81;
    let stepMax = 0;
    let stepMin = 99;
    let lastStepTime = 0;
    let lastMotionTime = 0;

    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeBtn = document.getElementById('modeBtn');
    const strideSlider = document.getElementById('strideSlider');
    const kVal = document.getElementById('kVal');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    function setupCanvas() {
      canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
      canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
      draw();
    }
    window.addEventListener('resize', setupCanvas);
    setupCanvas();

    // Slider Test
    strideSlider.addEventListener('input', function() {
      kVal.textContent = strideSlider.value;
    });

    // Mode Toggle: Gyro Turn-Rate vs Absolute Compass
    modeBtn.addEventListener('click', function() {
      useCompass = !useCompass;
      modeBtn.textContent = useCompass ? 'Compass Mode' : 'Gyro Mode';
      badge.textContent = useCompass ? 'Compass Active' : 'Gyro Active';
    });

    // Reset Button
    resetBtn.addEventListener('click', function() {
      steps = 0;
      dist = 0;
      posX = 0;
      posY = 0;
      headingDeg = 0;
      path = [{ x: 0, y: 0 }];
      updateReadout();
      draw();
      badge.textContent = 'Reset to 0,0';
    });

    // Start / Pause Button
    startBtn.addEventListener('click', function() {
      if (!tracking) {
        window.addEventListener('devicemotion', onMotion, true);
        window.addEventListener('deviceorientationabsolute', onCompass, true);
        tracking = true;
        lastMotionTime = performance.now();
        startBtn.textContent = 'Pause';
        startBtn.style.background = '#f59e0b';
        badge.textContent = 'Tracking...';
      } else {
        tracking = false;
        startBtn.textContent = 'Start';
        startBtn.style.background = '#38bdf8';
        badge.textContent = 'Paused';
      }
    });

    // Compass handler (only used if user switches to Compass Mode)
    function onCompass(e) {
      if (!tracking || !useCompass || e.alpha === null) return;
      // Only update compass if phone is held reasonably flat (prevents 180 tilt flip)
      if (Math.abs(e.beta) < 70 && Math.abs(e.gamma) < 70) {
        headingDeg = (360 - e.alpha) % 360;
        document.getElementById('hdgVal').textContent = Math.round(headingDeg) + '°';
        draw();
      }
    }

    // Motion handler: handles BOTH Gyro turn-rate and Step detection
    function onMotion(e) {
      if (!tracking) return;
      const now = performance.now();
      const dt = (now - lastMotionTime) / 1000;
      lastMotionTime = now;

      // 1. Pure Gyro Turn-Rate (immune to 180-degree compass/gimbal flip!)
      if (!useCompass && e.rotationRate && e.rotationRate.alpha !== null && dt < 0.5) {
        // Integrate Z-axis rotation rate (degrees/sec)
        const turnRate = e.rotationRate.alpha;
        if (Math.abs(turnRate) > 1.5) { // Deadzone to ignore tiny hand tremor
          headingDeg = (headingDeg - turnRate * dt + 360) % 360;
          document.getElementById('hdgVal').textContent = Math.round(headingDeg) + '°';
        }
      }

      // 2. Step Detection
      const acc = e.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;

      const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      filteredMag = 0.25 * mag + 0.75 * filteredMag;

      if (filteredMag > stepMax) stepMax = filteredMag;
      if (filteredMag < stepMin) stepMin = filteredMag;

      if (filteredMag > 11.1 && (now - lastStepTime) > 330) {
        lastStepTime = now;
        steps++;

        const k = parseFloat(strideSlider.value);
        const bounce = Math.max(0.5, stepMax - stepMin);
        const stride = k * Math.pow(bounce, 0.25);

        stepMax = 9.81;
        stepMin = 9.81;

        const rad = (headingDeg * Math.PI) / 180;
        posX += stride * Math.sin(rad);
        posY += stride * Math.cos(rad);
        dist += stride;

        path.push({ x: posX, y: posY });
        updateReadout();
      }
      draw();
    }

    function updateReadout() {
      document.getElementById('stepsVal').textContent = steps;
      document.getElementById('distVal').textContent = dist.toFixed(1) + 'm';
      document.getElementById('hdgVal').textContent = Math.round(headingDeg) + '°';
      document.getElementById('posVal').textContent = posX.toFixed(1) + ', ' + posY.toFixed(1);
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, w, h);

      const scale = 18 * dpr;
      const cx = w / 2 - posX * scale;
      const cy = h / 2 + posY * scale;

      // Origin dot
      ctx.fillStyle = '#64748b';
      ctx.beginPath();
      ctx.arc(cx, cy, 4 * dpr, 0, Math.PI * 2);
      ctx.fill();

      // Path line
      if (path.length > 1) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3 * dpr;
        ctx.beginPath();
        path.forEach((p, i) => {
          const px = cx + p.x * scale;
          const py = cy - p.y * scale;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.stroke();
      }

      // User center marker & direction pointer
      const ux = w / 2;
      const uy = h / 2;
      const rad = (headingDeg * Math.PI) / 180;

      ctx.save();
      ctx.translate(ux, uy);
      ctx.rotate(rad);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-12 * dpr, -30 * dpr);
      ctx.lineTo(12 * dpr, -30 * dpr);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(ux, uy, 6 * dpr, 0, Math.PI * 2);
      ctx.fill();
    }
  </script>
</body>
</html>

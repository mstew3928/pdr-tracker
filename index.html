<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Offline PDR Tracker v2</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    html, body {
      background: var(--bg);
      color: var(--text);
      width: 100%;
      height: 100%;
      height: 100dvh;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel);
      text-align: center;
      flex-shrink: 0;
    }
    .metric-box { background: var(--bg); padding: 6px 4px; border-radius: 6px; border: 1px solid #334155; }
    .metric-val { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .metric-lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
    
    /* Pinned Top Action Bar so buttons are NEVER hidden by mobile browser bars */
    .controls {
      padding: 8px 12px;
      background: var(--panel);
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #334155;
      align-items: center;
      flex-shrink: 0;
    }
    button {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #startBtn { flex: 1.3; background: var(--accent); color: #0f172a; }
    #resetBtn { flex: 1; background: #334155; color: var(--text); }
    #modeBtn { flex: 1; background: #0f172a; color: var(--accent); border: 1px solid var(--accent); }

    .canvas-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      width: 100%;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .footer-bar {
      padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 8px));
      background: var(--panel);
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .footer-bar input { width: 55%; }
  </style>
</head>
<body>

  <header>
    <h1>PDR Offline Navigation</h1>
    <span id="statusText" style="font-size: 0.8rem; color: #94a3b8;">Idle</span>
  </header>

  <div class="metrics">
    <div class="metric-box">
      <div class="metric-val" id="stepsVal">0</div>
      <div class="metric-lbl">Steps</div>
    </div>
    <div class="metric-box">
      <div class="metric-val" id="distVal">0.0 m</div>
      <div class="metric-lbl">Distance</div>
    </div>
    <div class="metric-box">
      <div class="metric-val" id="hdgVal">0°</div>
      <div class="metric-lbl">Heading</div>
    </div>
    <div class="metric-box">
      <div class="metric-val" id="posVal">0, 0</div>
      <div class="metric-lbl">X, Y (m)</div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn">Start Tracking</button>
    <button id="resetBtn">Zero / Reset</button>
    <button id="modeBtn">Mode: Gyro</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="mapCanvas"></canvas>
  </div>

  <div class="footer-bar">
    <span>Stride Constant (K): <strong id="kVal" style="color: #f8fafc;">0.45</strong></span>
    <input type="range" id="strideSlider" min="0.25" max="0.75" step="0.05" value="0.45" />
  </div>

  <script>
    let tracking = false;
    let useAbsoluteCompass = false; // false = Relative Gyro (best indoors), true = Magnetic Compass
    let steps = 0;
    let totalDistance = 0;
    let headingDeg = 0;
    let initialHeadingOffset = null;

    // Circular smoothing state to prevent angle jitter
    let smoothSin = 0;
    let smoothCos = 1;

    let posX = 0;
    let posY = 0;
    let path = [{ x: 0, y: 0 }];

    // Step detection state
    let filteredMag = 9.81;
    let stepMax = 0;
    let stepMin = 99;
    let lastStepTime = 0;
    const STEP_THRESHOLD = 11.1;
    const MIN_STEP_DELAY_MS = 330;

    // UI Elements
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeBtn = document.getElementById('modeBtn');
    const statusText = document.getElementById('statusText');
    const stepsVal = document.getElementById('stepsVal');
    const distVal = document.getElementById('distVal');
    const hdgVal = document.getElementById('hdgVal');
    const posVal = document.getElementById('posVal');
    const strideSlider = document.getElementById('strideSlider');
    const kVal = document.getElementById('kVal');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    strideSlider.addEventListener('input', (e) => {
      kVal.textContent = e.target.value;
    });

    function resizeCanvas() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      drawMap();
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    // --- Process Heading from a Single Active Source ---
    function processRawHeading(rawCompassDeg) {
      if (!tracking) return;

      // Calibrate zero offset so "straight ahead" at start = 0 degrees in Gyro mode
      if (!useAbsoluteCompass) {
        if (initialHeadingOffset === null) {
          initialHeadingOffset = rawCompassDeg;
        }
        rawCompassDeg = (rawCompassDeg - initialHeadingOffset + 360) % 360;
      }

      // Circular Low-Pass Filter (prevents 359 <-> 0 degree jump & flicker)
      const rad = (rawCompassDeg * Math.PI) / 180;
      const smoothing = 0.25;
      smoothSin = smoothing * Math.sin(rad) + (1 - smoothing) * smoothSin;
      smoothCos = smoothing * Math.cos(rad) + (1 - smoothing) * smoothCos;

      let filteredDeg = (Math.atan2(smoothSin, smoothCos) * 180) / Math.PI;
      headingDeg = (filteredDeg + 360) % 360;

      hdgVal.textContent = Math.round(headingDeg) + '°';
      drawMap();
    }

    // Relative Gyro Handler
    function handleRelativeOrientation(event) {
      if (useAbsoluteCompass) return; // Ignore if in Compass mode
      if (event.webkitCompassHeading !== undefined) {
        processRawHeading(event.webkitCompassHeading);
      } else if (event.alpha !== null) {
        processRawHeading((360 - event.alpha) % 360);
      }
    }

    // Absolute Magnetic Compass Handler
    function handleAbsoluteOrientation(event) {
      if (!useAbsoluteCompass) return; // Ignore if in Gyro mode
      if (event.webkitCompassHeading !== undefined) {
        processRawHeading(event.webkitCompassHeading);
      } else if (event.alpha !== null) {
        processRawHeading((360 - event.alpha) % 360);
      }
    }

    function handleMotion(event) {
      if (!tracking) return;
      const acc = event.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;

      const rawMag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      filteredMag = 0.25 * rawMag + 0.75 * filteredMag;

      if (filteredMag > stepMax) stepMax = filteredMag;
      if (filteredMag < stepMin) stepMin = filteredMag;

      const now = performance.now();

      if (filteredMag > STEP_THRESHOLD && (now - lastStepTime) > MIN_STEP_DELAY_MS) {
        lastStepTime = now;
        steps++;

        const k = parseFloat(strideSlider.value);
        const bounce = Math.max(0.5, stepMax - stepMin);
        const strideLength = k * Math.pow(bounce, 0.25);

        stepMax = 9.81;
